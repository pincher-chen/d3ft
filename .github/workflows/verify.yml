name: Verify response source and examples
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/verify_response_release.py
      - run: pip install -r requirements.txt
      - run: pip install --no-deps -e third_party/jrystal_dependency -e .
      - run: python scripts/check_response_cpu.py
      - run: python scripts/run_response.py --stage inspect
