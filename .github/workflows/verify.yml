name: Verify source and figures
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/verify_release.py
      - run: pip install -r requirements.txt -r requirements-figures.txt
      - run: pip install --no-deps -e third_party/jrystal_dependency -e .
      - run: python scripts/run_tests.py --suite smoke
      - run: python make_figures.py
